<!DOCTYPE html>
<html>
<head>
    <title>My Online Store</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
        }

        header {
            background-color: black;
            color: white;
            text-align: center;
            padding: 20px;
        }

        nav {
            background-color: #333;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 20px;
        }

        h2 {
            text-align: center;
        }

        .products {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }

        .product {
            background-color: white;
            width: 220px;
            padding: 15px;
            text-align: center;
            border-radius: 10px;
        }

        .product img {
            width: 100%;
            height: 200px;
        }

        .product button {
            background-color: green;
            color: white;
            padding: 10px;
            border: none;
            cursor: pointer;
        }

        footer {
            background-color: black;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Online Store</h1>
        <p>Welcome to our E-commerce Website</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <h2>Our Products</h2>

    <div class="products">

        <div class="product">
        <img src="https://contents.mediadecathlon.com/p2819190/4c689ea7679c2eaa03c610b3e2374416/p2819190.jpg" alt="shoes">
            <h3>Shoes</h3>
            <p>Price: ₹999</p>
            <button>Add to Cart</button>
        </div>

        <div class="product">
            <img src="https://m.media-amazon.com/images/I/81+d6eSA0eL._SY679_.jpg" alt="Shoes">

            <h3>Watch</h3>
            <p>Price: ₹1499</p>
            <button>Add to Cart</button>
        </div>

        <div class="product">
            <img src="https://imgs.search.brave.com/oXa_1_iJmt6cu8eaZR3HW41nfCUvwtPMfnPA4e-DHgI/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly93d3cu/bGlub3BlcnJvcy5j/b20vY2RuL3Nob3Av/ZmlsZXMvTFdTTDAw/NTU5VEFVUEUtMi53/ZWJwP3Y9MTc4NzEz/MTAyMyZ3aWR0aD0z/ODQw" alt="Bag">
            <h3>Bag</h3>
            <p>Price: ₹799</p>
            <button>Add to Cart</button>
        </div>

    </div>

    <footer>
        <p>© 2026 My Online Store</p>
    </footer>

</body>
</html>
